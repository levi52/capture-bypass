name: Release

# Triggers:
#   • automatically on a version tag push — git tag v1.2.3 && git push --tags
#   • manually from the Actions tab ("Run workflow"), either from a v* tag or
#     from any branch with the `version` input filled in
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 3.6.5 (leave empty when running from a v* tag)'
        required: false
        default: ''

# write = create releases + push the updated Scoop manifest back to main
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1b. Resolve version ──────────────────────────────────────────────────
      # A tag push derives the version from the tag name (v3.6.5 → 3.6.5).
      # A manual run from a branch has no tag, so it needs the `version` input.
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}" -ne "") {
            $raw = "${{ inputs.version }}"
          }
          $version = $raw.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Resolved version '$version' is not X.Y.Z — pass the 'version' input when running manually."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"    >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version (tag v$version)"

      # ── 2. Rust toolchain (x64 + x86 + ARM64) ──────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc

      # ── 3. Cache compiled deps ───────────────────────────────────────────────
      # Split into two entries:
      #   a) registry  — downloaded crate source (~200 MB, shared across all arches,
      #                  invalidates only when Cargo.lock changes)
      #   b) target    — compiled artefacts for all three arches (~3-6 GB total,
      #                  keyed separately so a dep update doesn't evict both at once)
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache build artefacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # ── 4. Build x64 (GUI + CLI + stress tester + both payload DLLs) ─────────
      - name: Build x64
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ steps.ver.outputs.version }}"
          cargo build --release `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli `
            -p gui `
            -p stress_tester

      # ── 5. Build x86 (CLI + payload DLLs only) ──────────────────────────────
      - name: Build x86
        run: |
          cargo build --release --target i686-pc-windows-msvc `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli

      # ── 5b. Build ARM64 (GUI + CLI + stress tester + both payload DLLs) ──────
      - name: Build ARM64
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ steps.ver.outputs.version }}"
          cargo build --release --target aarch64-pc-windows-msvc `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli `
            -p gui `
            -p stress_tester

      # ── 6. Build Windows installer with Inno Setup ──────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            installer\capture-bypass.iss

      # ── 7. Package portable zips (x64 + ARM64, used by Scoop) ───────────────
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"

          # ── x64 ───────────────────────────────────────────────────────────────
          $stage = "dist\portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\capture_bypass_gui.exe     $stage\
          Copy-Item target\release\stress_tester.exe          $stage\
          Copy-Item target\release\payload_dll.dll            $stage\
          Copy-Item target\release\payload_dll_persistent.dll $stage\
          if (Test-Path target\i686-pc-windows-msvc\release\payload_dll.dll) {
            New-Item -ItemType Directory -Force $stage\x86 | Out-Null
            Copy-Item target\i686-pc-windows-msvc\release\payload_dll.dll             $stage\x86\
            Copy-Item target\i686-pc-windows-msvc\release\payload_dll_persistent.dll $stage\x86\
          }
          Compress-Archive -Path $stage\* `
            -DestinationPath "dist\capture-bypass-$version-portable-x64.zip"

          # ── ARM64 ─────────────────────────────────────────────────────────────
          $arm64 = "dist\portable-arm64"
          New-Item -ItemType Directory -Force $arm64 | Out-Null
          Copy-Item target\aarch64-pc-windows-msvc\release\capture_bypass_gui.exe     $arm64\
          Copy-Item target\aarch64-pc-windows-msvc\release\stress_tester.exe          $arm64\
          Copy-Item target\aarch64-pc-windows-msvc\release\payload_dll.dll            $arm64\
          Copy-Item target\aarch64-pc-windows-msvc\release\payload_dll_persistent.dll $arm64\
          # Include x86 DLLs — ARM64 Windows runs x86 processes via WoW64
          if (Test-Path target\i686-pc-windows-msvc\release\payload_dll.dll) {
            New-Item -ItemType Directory -Force $arm64\x86 | Out-Null
            Copy-Item target\i686-pc-windows-msvc\release\payload_dll.dll             $arm64\x86\
            Copy-Item target\i686-pc-windows-msvc\release\payload_dll_persistent.dll $arm64\x86\
          }
          Compress-Archive -Path $arm64\* `
            -DestinationPath "dist\capture-bypass-$version-portable-arm64.zip"

      # ── 8. Checksums + release body + Scoop manifest ─────────────────────────
      - name: Generate release artifacts
        shell: pwsh
        run: |
          $version   = "${{ steps.ver.outputs.version }}"
          $installer = "capture-bypass-setup-$version-x64.exe"
          $portable  = "capture-bypass-$version-portable-x64.zip"
          $portArm64 = "capture-bypass-$version-portable-arm64.zip"
          $hashInst   = (Get-FileHash "dist\$installer" -Algorithm SHA256).Hash.ToLower()
          $hashPort   = (Get-FileHash "dist\$portable"  -Algorithm SHA256).Hash.ToLower()
          $hashArm64  = (Get-FileHash "dist\$portArm64" -Algorithm SHA256).Hash.ToLower()

          # ── SHA256SUMS.txt ────────────────────────────────────────────────────
          "$hashInst   $installer",
          "$hashPort   $portable",
          "$hashArm64  $portArm64" |
            Out-File dist\SHA256SUMS.txt -Encoding utf8NoBOM

          # ── Release body ──────────────────────────────────────────────────────
          $body = @(
            '# capture-bypass',
            '',
            "Removes ``WDA_EXCLUDEFROMCAPTURE`` screen-capture protection from Windows",
            "application windows, letting OBS, Snipping Tool, and any other capture",
            "software record them normally.",
            '',
            '## Requirements',
            '',
            '- Windows 10 version 2004 (build 19041) or later',
            '- x64 **or** ARM64 (Snapdragon X / Surface) system',
            '- Administrator rights at runtime (UAC prompt on launch — no admin needed to install)',
            '',
            '## Install',
            '',
            '**Installer** *(recommended, x64)*',
            "Download and run ``$installer`` below.",
            '',
            '**Scoop**',
            '```powershell',
            'scoop bucket add levi52 https://github.com/levi52/capture-bypass',
            'scoop install capture-bypass',
            '```',
            '',
            '**ARM64 (portable)**',
            "Download ``$portArm64`` — native binary for Snapdragon X / Surface ARM64 devices.",
            '',
            '## Verify before running',
            '',
            '```powershell',
            "Get-FileHash `".\$installer`" -Algorithm SHA256",
            '```',
            "**Expected SHA-256 (installer / x64):** ``$hashInst``  ",
            "**Expected SHA-256 (portable x64):**    ``$hashPort``  ",
            "**Expected SHA-256 (portable ARM64):**  ``$hashArm64``  ",
            '',
            "Full checksums are also in ``SHA256SUMS.txt``.",
            '',
            '---'
          )
          $body -join "`n" | Out-File dist\release-body.txt -Encoding utf8NoBOM

          # ── Scoop manifest ────────────────────────────────────────────────────
          $base = "https://github.com/levi52/capture-bypass/releases/download/v$version"
          $manifest = Get-Content bucket\capture-bypass.json -Raw | ConvertFrom-Json
          $manifest.version = $version

          $manifest.architecture.'64bit'.url  = "$base/$portable"
          $manifest.architecture.'64bit'.hash = "sha256:$hashPort"

          # Add / update arm64 architecture entry
          $arm64entry = [PSCustomObject]@{
            url  = "$base/$portArm64"
            hash = "sha256:$hashArm64"
          }
          if ($manifest.architecture.PSObject.Properties['arm64']) {
            $manifest.architecture.arm64 = $arm64entry
          } else {
            $manifest.architecture | Add-Member -NotePropertyName arm64 `
                                                -NotePropertyValue $arm64entry
          }

          # Add / update arm64 autoupdate entry
          $arm64auto = [PSCustomObject]@{
            url = "$base/capture-bypass-`$version-portable-arm64.zip"
          }
          if ($manifest.autoupdate.architecture.PSObject.Properties['arm64']) {
            $manifest.autoupdate.architecture.arm64 = $arm64auto
          } else {
            $manifest.autoupdate.architecture | Add-Member -NotePropertyName arm64 `
                                                           -NotePropertyValue $arm64auto
          }

          $manifest | ConvertTo-Json -Depth 10 |
            Out-File dist\scoop-manifest-updated.json -Encoding utf8NoBOM

      # ── 9. Commit updated Scoop manifest back to main ────────────────────────
      - name: Push Scoop manifest
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b update-scoop origin/main
          Copy-Item dist\scoop-manifest-updated.json bucket\capture-bypass.json
          git add bucket\capture-bypass.json
          $changed = git diff --staged --name-only
          if ($changed) {
            git commit -m "chore: update Scoop manifest to ${{ steps.ver.outputs.tag }}"
            git push origin update-scoop:main
          }

      # ── 10. Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: dist/release-body.txt
          # Explicit tag: a manual run from a branch has no tag ref, and Scoop
          # downloads from /releases/download/v<version>/… which needs one.
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/capture-bypass-setup-*-x64.exe
            dist/capture-bypass-*-portable-x64.zip
            dist/capture-bypass-*-portable-arm64.zip
            dist/SHA256SUMS.txt
